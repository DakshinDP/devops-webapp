<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps WebApp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 60px;
            background: #f4f4f4;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>DevOps WebApp 🚀 - CI/CD Live</h1>

        <p>End-to-End DevOps Automation</p>

        <p>
            This website is deployed using a CI/CD pipeline.
        </p>

        <button onclick="showMessage()">
            Test Application
        </button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "CI/CD Pipeline is working successfully!";
        }
    </script>

</body>
</html>
