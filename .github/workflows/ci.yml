name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Validate HTML file
        run: |
          test -f index.html
          echo "index.html exists successfully"

      - name: Build project
        run: |
          echo "Building static website..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully"

      - name: Display build output
        run: |
          echo "Build output:"
          ls -la build

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Send success notification
        if: needs.build.result == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ CI Pipeline Successful\nRepository: devops-webapp\nBranch: main"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Send failure notification
        if: needs.build.result != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ CI Pipeline Failed\nRepository: devops-webapp\nBranch: main"}' \
            "$SLACK_WEBHOOK_URL"
