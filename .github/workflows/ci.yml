name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Validate HTML file
        run: |
          test -f index.html
          echo "index.html exists successfully"

      - name: Build project
        run: |
          echo "Building static website..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully"

      - name: Display build output
        run: |
          echo "Build output:"
          ls -la build